name: Build Windows Client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "发版前递增版本（none = 使用当前版本）"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      publish_release:
        description: "构建完成后发布到 GitHub Releases"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version / bump
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP: ${{ github.event.inputs.bump || 'none' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          current() {
            python -c "import re, pathlib; t=pathlib.Path('core/config.py').read_text(encoding='utf-8'); print(re.search(r'__version__\\s*=\\s*\"([^\"]+)\"', t).group(1))"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$BUMP" != "none" ]; then
              VERSION=$(python scripts/bump_version.py "$BUMP")
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add core/config.py
              git commit -m "chore: bump version to ${VERSION}"
              git push origin HEAD:main
            else
              VERSION=$(current)
            fi
            TAG="v${VERSION}"
          else
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
            CFG=$(current)
            if [ "$CFG" != "$VERSION" ]; then
              echo "::warning::tag ${TAG} != core/config.py __version__=${CFG} (artifact named by tag)"
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} tag=${TAG}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "PyInstaller>=6.3" "flet-cli==0.85.3"

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Zip release artifact
        id: zip
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $src = "dist\test_tool_flet"
          if (-not (Test-Path "$src\test_tool_flet.exe")) {
            throw "Missing $src\test_tool_flet.exe"
          }
          $zip = "test_tool_flet-v$ver-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"
          echo "artifact=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-tool-flet-windows
          path: ${{ steps.zip.outputs.artifact }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: 测试工具箱 ${{ steps.meta.outputs.tag_name }}
          files: ${{ steps.zip.outputs.artifact }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
