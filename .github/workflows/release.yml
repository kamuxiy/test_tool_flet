name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "PyInstaller>=6.3" "flet-cli==0.85.3"

      - name: Bump version
        id: version
        shell: bash
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump || 'patch' }}
        run: |
          NEW_VERSION=$(python scripts/bump_version.py "$BUMP")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION ($BUMP)"

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/config.py
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Package Windows app
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Zip release artifact
        id: zip
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $src = "dist\test_tool_flet"
          if (-not (Test-Path "$src\test_tool_flet.exe")) {
            throw "Missing $src\test_tool_flet.exe"
          }
          $zip = "test_tool_flet-v$ver-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"
          echo "artifact=$zip" >> $env:GITHUB_OUTPUT

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## 测试工具箱 ${TAG}"
            echo
            echo "Windows 目录版安装包（解压后运行 \`test_tool_flet.exe\`）。"
            echo
            if [ -n "$PREV" ]; then
              echo "### Changes since ${PREV}"
              echo
              git log --pretty=format:'- %s (%h)' "${PREV}..HEAD" --no-merges \
                | grep -v 'chore: bump version' || true
            else
              echo "### Changes"
              echo
              echo "- Initial automated release"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.zip.outputs.artifact }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
